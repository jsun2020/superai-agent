[package]
name = "superai-agent-desktop"
version = "0.2.23"
edition = "2021"

[lib]
name = "superai_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.102"
# OS trust store -> PEM for the Bun sidecars (NODE_EXTRA_CA_CERTS); see read_system_ca_env
rustls-native-certs = "0.8"
base64 = "0.22"
portable-pty = "0.9.0"

# Windows system proxy (HKCU\...\Internet Settings) -> HTTPS_PROXY for the Bun
# sidecars; see read_system_proxy_env. Already in the lock via tauri's tree.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
